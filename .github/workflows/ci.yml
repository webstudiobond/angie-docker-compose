name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint & Validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate docker-compose.yaml
        run: docker compose -f docker-compose.yaml config --quiet

      - name: Install linters
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shfmt devscripts

      - name: Find all shell scripts
        id: find-scripts
        run: |
          scripts=$(find usr/local/bin tests -type f \( -name "*.sh" -o -name "angie" \) | tr '\n' ' ')
          echo "scripts=${scripts}" >> $GITHUB_OUTPUT
          echo "Found scripts: ${scripts}"

      - name: Run shellcheck
        run: |
          scripts="${{ steps.find-scripts.outputs.scripts }}"
          if [ -n "${scripts}" ]; then
            shellcheck --enable=all -x ${scripts}
          fi

      - name: Check formatting (shfmt)
        run: |
          scripts="${{ steps.find-scripts.outputs.scripts }}"
          if [ -n "${scripts}" ]; then
            shfmt -d -s -i 2 ${scripts}
          fi

      - name: Check bashisms
        run: |
          scripts="${{ steps.find-scripts.outputs.scripts }}"
          if [ -n "${scripts}" ]; then
            checkbashisms -f ${scripts} || true
          fi

  test:
    name: Shell Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: TypedDevs/bashunit@860c797a48e34be20b019a70f58c0e06d15c8d33 # 0.51.0

      - name: Run unit tests
        run: bashunit tests/

  trivy:
    name: Trivy Scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
