# debug < info < notice < warn < error < crit < alert < emerg
error_log            /var/log/angie/error.log error;
worker_processes     4;
worker_rlimit_nofile 65536;

pid                  /run/angie/angie.pid;
include              /etc/angie/modules.conf;
include              /etc/angie/conf.d/main/*.conf;

events {
    worker_connections 1024;
    use                epoll;
    multi_accept       on;
}

http {
    sendfile                      on;
    tcp_nopush                    on;
    tcp_nodelay                   on;
    client_header_timeout         180s;
    client_body_timeout           180s;
    client_header_buffer_size     2k;
    client_body_buffer_size       256k;
    client_max_body_size          1024m;
    large_client_header_buffers   4 8k;
    send_timeout                  60s;
    keepalive_timeout             30s;
    keepalive_requests            1000;
    reset_timedout_connection     on;
    server_tokens                 off;
    server_names_hash_max_size    512;
    server_names_hash_bucket_size 512;
    variables_hash_max_size       1024;
    variables_hash_bucket_size    128;
    charset                       utf-8;

    proxy_redirect                off;
    proxy_set_header              Host $host;
    proxy_set_header              Early-Data $ssl_early_data;
    proxy_set_header              X-Real-IP $remote_addr;
    proxy_set_header              X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_pass_header             Set-Cookie;
    proxy_buffers                 256 4k;
    proxy_buffer_size             32k;
    proxy_busy_buffers_size       32k;
    proxy_temp_file_write_size    256k;
    proxy_connect_timeout         30s;
    proxy_read_timeout            300s;
    proxy_send_timeout            180s;

    log_format                    main '$remote_addr - $remote_user [$time_local] "$request" ' '$status $body_bytes_sent "$http_referer" ' '"$http_user_agent" "$http_x_forwarded_for"';
    log_format                    extended '$remote_addr - $remote_user [$time_local] "$request" ' '$status $body_bytes_sent "$http_referer" rt="$request_time" ' '"$http_user_agent" "$http_x_forwarded_for" ' 'h="$host" sn="$server_name" ru="$request_uri" u="$uri" ' 'ucs="$upstream_cache_status" ua="$upstream_addr" us="$upstream_status" ' 'uct="$upstream_connect_time" urt="$upstream_response_time"';
    log_not_found                 off;
	access_log                    off;

	include                       /etc/angie/mime.types;
    default_type                  application/octet-stream;

    gzip                          on;
    gzip_vary                     on;
    gzip_static                   on;
    gzip_comp_level               6;
    gzip_min_length               1024;
    gzip_buffers                  128 4k;
    gzip_http_version             1.1;
    gzip_types                    text/css text/javascript text/js text/plain text/richtext text/shtml text/x-component text/x-java-source text/x-markdown text/x-script text/xml image/bmp image/svg+xml image/vnd.microsoft.icon image/x-icon font/otf font/ttf font/x-woff multipart/bag multipart/mixed application/eot application/font application/font-sfnt application/font-woff application/javascript application/javascript-binast application/json application/ld+json application/manifest+json application/opentype application/otf application/rss+xml application/ttf application/truetype application/vnd.api+json application/vnd.ms-fontobject application/wasm application/xhtml+xml application/xml application/xml+rss application/x-httpd-cgi application/x-javascript application/x-opentype application/x-otf application/x-perl application/x-protobuf application/x-ttf;
    gzip_proxied                   any;

    brotli                         on;
    brotli_comp_level              6;
    brotli_static                  on;
    brotli_types                   text/css text/javascript text/js text/plain text/richtext text/shtml text/x-component text/x-java-source text/x-markdown text/x-script text/xml image/bmp image/svg+xml image/vnd.microsoft.icon image/x-icon font/otf font/ttf font/x-woff multipart/bag multipart/mixed application/eot application/font application/font-sfnt application/font-woff application/javascript application/javascript-binast application/json application/ld+json application/manifest+json application/opentype application/otf application/rss+xml application/ttf application/truetype application/vnd.api+json application/vnd.ms-fontobject application/wasm application/xhtml+xml application/xml application/xml+rss application/x-httpd-cgi application/x-javascript application/x-opentype application/x-otf application/x-perl application/x-protobuf application/x-ttf;

    zstd                           on;
    zstd_comp_level                3;
    zstd_static                    on;
    zstd_types                     text/css text/javascript text/js text/plain text/richtext text/shtml text/x-component text/x-java-source text/x-markdown text/x-script text/xml image/bmp image/svg+xml image/vnd.microsoft.icon image/x-icon font/otf font/ttf font/x-woff multipart/bag multipart/mixed application/eot application/font application/font-sfnt application/font-woff application/javascript application/javascript-binast application/json application/ld+json application/manifest+json application/opentype application/otf application/rss+xml application/ttf application/truetype application/vnd.api+json application/vnd.ms-fontobject application/wasm application/xhtml+xml application/xml application/xml+rss application/x-httpd-cgi application/x-javascript application/x-opentype application/x-otf application/x-perl application/x-protobuf application/x-ttf;

    include                         /etc/angie/conf.d/cloudflare-ips.inc;
    real_ip_header                  CF-Connecting-IP;

    ssl_buffer_size                 1369;
    ssl_ciphers                      "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-AES128-SHA256:ECDHE-RSA-AES128-SHA256:DHE-RSA-AES128-SHA256:ECDHE-ECDSA-AES256-SHA384:ECDHE-RSA-AES256-SHA384:DHE-RSA-AES256-SHA256";
    ssl_dhparam                     /etc/angie/dhparam.pem;
    ssl_early_data                  on;
    ssl_ecdh_curve                  auto;
    ssl_prefer_server_ciphers       on;
    ssl_protocols                   TLSv1.2 TLSv1.3;
    ssl_session_cache               shared:SSL:20m;
    ssl_session_tickets             on;
    ssl_session_timeout             7d;

    resolver                        127.0.0.11 valid=300s ipv6=off;
    resolver_timeout                5s;

    proxy_cache_path                /var/cache/angie levels=2 keys_zone=cache:10m inactive=60m max_size=1024m;
    proxy_cache_key                  "$scheme$request_method$host$request_uri";
    proxy_temp_path                 /var/cache/angie/temp;
    client_body_temp_path           /var/cache/angie/client_temp;
    proxy_ignore_headers            Cache-Control Expires;
    proxy_cache_use_stale           error timeout invalid_header updating http_502;
    proxy_cache_valid               any 1d;

    add_header                      X-Frame-Options "SAMEORIGIN" always;
    add_header                      X-XSS-Protection "1; mode=block" always;
    add_header                       X-Content-Type-Options "nosniff" always;
    add_header                      Referrer-Policy "no-referrer-when-downgrade" always;

    open_file_cache                 max=10000 inactive=30s;
    open_file_cache_valid           60s;
    open_file_cache_min_uses        2;
    open_file_cache_errors          off;

    include /etc/angie/conf.d/healthcheck.inc;

    include /etc/angie/conf.d/*.conf;
    include /etc/angie/conf.d/domains/*.conf;
}
