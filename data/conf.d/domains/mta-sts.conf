# =============================================================================
# MTA-STS VIRTUAL HOST TEMPLATE (STALWART)
# =============================================================================
# Exposes the SMTP MTA-STS policy endpoint (RFC 8461) for inbound TLS enforcement:
#   - /.well-known/mta-sts.txt
#
# Deployment:
#   - Replace 'mta-sts.example' with your actual MTA-STS domain.
#   - Replace 'mta_sts' with a unique ACME identifier.
#   - Replace 'stalwart_mtasts_backend' with a unique upstream pool name.
# =============================================================================

upstream stalwart_mtasts_backend {
    zone stalwart_mtasts_backend 64k;
    server stalwart:8080 resolve;
    keepalive 32;
}

acme_client mta_sts https://acme-v02.api.letsencrypt.org/directory;

server {
    listen 80;
    server_name mta-sts.example;

    acme mta_sts;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name mta-sts.example;

    acme mta_sts;

    ssl_certificate $acme_cert_mta_sts;
    ssl_certificate_key $acme_cert_key_mta_sts;

    access_log /var/log/angie/domains/mta-sts.example.log extended;
    error_log /var/log/angie/domains/mta-sts.example.error.log error;

    if ($anti_replay = 307) { return 307 https://$host$request_uri; }
    if ($anti_replay = 425) { return 425; }

    include /etc/angie/conf.d/security-headers.inc;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    include /etc/angie/conf.d/error-pages.inc;

    location = /.well-known/mta-sts.txt {
        proxy_pass http://stalwart_mtasts_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Early-Data $rfc_early_data;

        access_log off;
    }

    location / {
        return 404;
    }
}
