# Deployment checklist & warnings:
# - This template is a reference example. Do NOT copy blindly.
# - Select only the protocols configured in your Mihomo setup (e.g. VLESS over WebSocket, gRPC, or XHTTP) and remove unused upstreams and location blocks.
# - Replace upstream ports 10001, 10002, 10003 with the actual inbound ports configured in your Mihomo config.yaml.
# - STRONGLY RECOMMENDED: Replace sample paths ('/ws', '/grpc', '/xhttp-one/') with site-specific unpredictable secret subpaths for defense-in-depth. Do not leave predictable default paths.
# - Replace 'mihomo.example' with your target domain.
# - Replace 'mihomo_ws_backend', 'mihomo_grpc_backend', 'mihomo_xhttp_backend' with unique upstream pool names if running multiple instances.

upstream mihomo_ws_backend {
    zone mihomo_ws_backend 64k;
    server mihomo:10001 resolve;
    keepalive 32;
}

upstream mihomo_grpc_backend {
    zone mihomo_grpc_backend 64k;
    server mihomo:10002 resolve;
    keepalive 32;
}
upstream mihomo_xhttp_backend {
    zone mihomo_xhttp_backend 64k;
    server mihomo:10003 resolve;
    keepalive 32;
}

acme_client mihomo https://acme-v02.api.letsencrypt.org/directory;

# 1 = log, 0 = silence
geo $remote_addr $mihomo_log_ip {
    default                 1;
    # 127.0.0.1               0;
    # ::1                     0;
}

map $http_user_agent $mihomo_log_ua {
    default                 1;
    # ~*Gatus/                0;
}

map $request_uri $mihomo_log_uri {
    default          1;
    # ~^/ws           0;
    # ~^/grpc         0;
    # ~^/xhttp-one/   0;
}

map "$mihomo_log_ip:$mihomo_log_ua:$mihomo_log_uri" $mihomo_need_log {
    default                 1;
    ~0                      0;
}

server {
    listen 80;
    server_name mihomo.example;

    acme mihomo;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen 443 quic;
    server_name mihomo.example;

    acme mihomo;

    ssl_certificate $acme_cert_mihomo;
    ssl_certificate_key $acme_cert_key_mihomo;

    add_header Alt-Svc 'h3=":443"; ma=86400';

    access_log /var/log/angie/domains/mihomo.example.log extended if=$mihomo_need_log;
    error_log /var/log/angie/domains/mihomo.example.error.log error;

    if ($anti_replay = 307) { return 307 https://$host$request_uri; }
    if ($anti_replay = 425) { return 425; }

    include /etc/angie/conf.d/security-headers.inc;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    include /etc/angie/conf.d/error-pages.inc;

    location ~ /\.(?!well-known\/) {
        return 404;
    }

    location ^~ /ws {
        proxy_pass http://mihomo_ws_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
    }

    location ^~ /grpc {
        if ($content_type !~ "application/grpc") {
            return 404;
        }
        client_max_body_size 0;
        client_body_timeout 1071906480m;
        grpc_read_timeout 1071906480m;

        grpc_set_header Host $host;
        grpc_set_header X-Real-IP $remote_addr;
        grpc_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        grpc_pass grpc://mihomo_grpc_backend;
    }

    location ^~ /xhttp-one/ {
        if ($content_type !~ "application/grpc") {
            return 404;
        }
        client_max_body_size 0;
        grpc_read_timeout 315;
        grpc_send_timeout 5m;

        grpc_set_header Host $host;
        grpc_set_header X-Real-IP $remote_addr;
        grpc_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        grpc_pass grpc://mihomo_xhttp_backend;
    }

    location / {
        return 404;
    }
}
