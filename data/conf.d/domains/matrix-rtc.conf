# Deployment checklist:
# - Replace 'matrix-rtc.example.com' with your MatrixRTC / LiveKit TURN FQDN (matching TUWUNEL_WELL_KNOWN__LIVEKIT_URL, LIVEKIT_URL, and turn.domain; keep DNS-only, without Cloudflare proxy).
# - Replace 'matrix_rtc' with a unique ACME identifier if running multiple instances (shared with conf.d/stream/livekit-turn.inc).
# - Replace 'matrix_lk_jwt_backend' and 'matrix_livekit_backend' with unique upstream pool names if running multiple instances.
# - Tighten Access-Control-Allow-Origin from '*' to 'https://element.example.com' on /livekit/jwt/ only if external federated callers never join calls on this SFU.
# - Ensure firewall permits TCP 7881 and UDP 7882 directly to LiveKit, plus TCP 5349 via Angie (conf.d/stream.inc -> conf.d/stream/livekit-turn.inc) for TURN/TLS.

upstream matrix_lk_jwt_backend {
    zone matrix_lk_jwt_backend 64k;
    server matrix-lk-jwt-service:8080 resolve;
    keepalive 32;
}

upstream matrix_livekit_backend {
    zone matrix_livekit_backend 64k;
    server matrix-livekit:7880 resolve;
    keepalive 64;
}

acme_client matrix_rtc https://acme-v02.api.letsencrypt.org/directory;

map $http_upgrade $matrix_rtc_connection_upgrade {
    default upgrade;
    ''      "";
}

# 1 = log, 0 = silence
geo $remote_addr $matrix_rtc_log_ip {
    default                 1;
    # 127.0.0.1               0;
    # ::1                     0;
    # 192.168.1.0/24          0;
    # 10.0.0.0/8              0;
    # 2001:db8::/64           0;
}

map $http_user_agent $matrix_rtc_log_ua {
    default                 1;
    # ~*Gatus/                0;
    # ~*Uptime-Kuma           0;
    # ~*UptimeRobot           0;
    # ~*BetterStack           0;
    # ~*Pingdom               0;
    # ~*Site24x7              0;
    # ~*StatusCake            0;
}

map $request_uri $matrix_rtc_log_uri {
    default                        full;
    ~*^/livekit/jwt(?:/|\?|$)      auth;
    ~*^/twirp(?:/|\?|$)            auth;
    ~*^/(?:rtc|settings)(?:/|\?|$) quiet;
    ~*^/livekit/sfu(?:/|\?|$)      quiet;
}

map "$matrix_rtc_log_ip:$matrix_rtc_log_ua:$matrix_rtc_log_uri:$status" $matrix_rtc_need_log {
    default                           0;
    ~^1:1:full:\d+$                   1;
    ~^1:1:auth:(?:401|403|429|5\d\d)$ 1;
    ~^1:1:quiet:(?:429|5\d\d)$        1;
}

server {
    listen 80;
    server_name matrix-rtc.example.com;

    acme matrix_rtc;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen 443 quic;
    server_name matrix-rtc.example.com;

    acme matrix_rtc;

    ssl_certificate $acme_cert_matrix_rtc;
    ssl_certificate_key $acme_cert_key_matrix_rtc;

    add_header Alt-Svc 'h3=":443"; ma=86400';

    access_log /var/log/angie/domains/matrix-rtc.example.com.log extended if=$matrix_rtc_need_log;
    error_log /var/log/angie/domains/matrix-rtc.example.com.error.log error;

    if ($anti_replay = 307) { return 307 https://$host$request_uri; }
    if ($anti_replay = 425) { return 425; }

    include /etc/angie/conf.d/security-headers.inc;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    include /etc/angie/conf.d/error-pages.inc;

    location ~ /\.(?!well-known\/) {
        return 404;
    }

    location ^~ /livekit/jwt/ {
        if ($request_method !~ ^(GET|HEAD|POST|OPTIONS)$) {
            return 405;
        }

        if ($request_method = OPTIONS) {
            include /etc/angie/conf.d/security-headers.inc;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header Alt-Svc 'h3=":443"; ma=86400';
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, HEAD, POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept, Origin, X-Requested-With" always;
            add_header Access-Control-Max-Age "86400" always;
            return 204;
        }

        client_max_body_size 1m;

        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Max-Age;

        include /etc/angie/conf.d/security-headers.inc;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Alt-Svc 'h3=":443"; ma=86400';
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept, Origin, X-Requested-With" always;

        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        proxy_pass http://matrix_lk_jwt_backend/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Early-Data $rfc_early_data;
    }

    location ^~ /livekit/sfu/ {
        limit_except GET HEAD POST OPTIONS {
            deny all;
        }

        client_max_body_size 1m;
        proxy_buffering off;

        proxy_connect_timeout 10s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;

        proxy_pass http://matrix_livekit_backend/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $matrix_rtc_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Early-Data $rfc_early_data;
    }

    location ~ ^/(?:rtc|settings|twirp)(?:/|$) {
        limit_except GET HEAD POST OPTIONS {
            deny all;
        }

        client_max_body_size 1m;
        proxy_buffering off;

        proxy_connect_timeout 10s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;

        proxy_pass http://matrix_livekit_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $matrix_rtc_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Early-Data $rfc_early_data;
    }

    location / {
        return 404;
    }
}
