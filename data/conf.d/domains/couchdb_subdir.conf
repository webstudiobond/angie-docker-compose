# =============================================================================
# COUCHDB VIRTUAL HOST TEMPLATE (SUB-DIRECTORY)
# =============================================================================
# Production Apache CouchDB template under a sub-directory (default '/couchdb/').
# Includes HTTP/3 (QUIC), long-polling streaming support, session routing, and
# default deny (404) for all other paths.
#
# Deployment:
#   - Replace 'couchdb.example' with your actual domain name.
#   - Customize the subpath by replacing '/couchdb' with your desired path (e.g., '/sync').
#   - All requests outside the configured subpath and /_session receive a 404 response.
#   - To embed into an existing virtual host, copy the upstream and location blocks.
# =============================================================================

upstream couchdb_backend {
    zone couchdb_backend 64k;
    server couchdb:5984 resolve;
    keepalive 32;
}

acme_client couchdb https://acme-v02.api.letsencrypt.org/directory;

# Conditional Access Logging
# Sample filter rules are commented out by default; uncomment or add entries to silence (0) matching logs.

# Filter by client IP address or CIDR subnet
geo $remote_addr $couchdb_log_ip {
    default                 1;
    # 127.0.0.1               0;
    # ::1                     0;
    # 192.168.1.0/24          0;
    # 10.0.0.0/8              0;
    # 2001:db8::/64           0;
}

# Filter by User-Agent (e.g., monitoring probes, uptime bots)
map $http_user_agent $couchdb_log_ua {
    default                 1;
    # ~*Gatus/                0;
    # ~*Uptime-Kuma           0;
    # ~*UptimeRobot           0;
    # ~*BetterStack           0;
    # ~*Pingdom               0;
    # ~*Site24x7              0;
    # ~*StatusCake            0;
}

# Filter by Request URI (e.g., static assets, root ping)
map $request_uri $couchdb_log_uri {
    default                 1;
    # ~*^/favicon\.ico$       0;
    # ~*^/robots\.txt$        0;
}

# Aggregated logging decision: if any filter evaluates to 0, access logging is suppressed
map "$couchdb_log_ip:$couchdb_log_ua:$couchdb_log_uri" $couchdb_need_log {
    default                 1;
    ~0                      0;
}

server {
    listen 80;
    server_name couchdb.example;

    acme couchdb;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen 443 quic;
    server_name couchdb.example;

    acme couchdb;

    ssl_certificate $acme_cert_couchdb;
    ssl_certificate_key $acme_cert_key_couchdb;

    add_header Alt-Svc 'h3=":443"; ma=86400';

    access_log /var/log/angie/domains/couchdb.example.log extended if=$couchdb_need_log;
    error_log /var/log/angie/domains/couchdb.example.error.log error;

    client_max_body_size 500m;

    if ($anti_replay = 307) { return 307 https://$host$request_uri; }
    if ($anti_replay = 425) { return 425; }

    include /etc/angie/conf.d/security-headers.inc;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    include /etc/angie/conf.d/error-pages.inc;

    location ~ /\.(?!well-known\/) {
        return 404;
    }

    location ^~ /couchdb/ {
        if ($request_method !~ ^(GET|HEAD|POST|PUT|DELETE|OPTIONS|COPY)$) {
            return 405;
        }

        rewrite ^/couchdb/(.*)$ /$1 break;
        proxy_pass http://couchdb_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Early-Data $rfc_early_data;

        proxy_set_header Connection "";

        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 3600s;

        proxy_buffering off;
        proxy_request_buffering off;

        access_log off;
    }

    location ^~ /_session {
        if ($request_method !~ ^(GET|HEAD|POST|DELETE|OPTIONS)$) {
            return 405;
        }

        proxy_pass http://couchdb_backend/_session;
        proxy_http_version 1.1;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Early-Data $rfc_early_data;

        proxy_set_header Connection "";

        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        proxy_buffering off;

        access_log off;
    }

    location / {
        return 404;
    }
}
