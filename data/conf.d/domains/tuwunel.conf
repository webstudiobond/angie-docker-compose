# Deployment checklist:
# - Replace 'tuwunel.example.com' with your Matrix homeserver FQDN.
# - Replace 'tuwunel' with a unique ACME identifier if running multiple instances.
# - Replace 'tuwunel_backend' with a unique upstream pool name if running multiple instances.
# - Match client_max_body_size (200m) with TUWUNEL_HTTP__MAX_REQUEST_SIZE (209715200) in tuwunel/.env.
# - Ensure TUWUNEL_HTTP__IP_SOURCE=rightmost_x_forwarded_for is set in tuwunel/.env so Tuwunel trusts the IP appended by $proxy_add_x_forwarded_for.
# - Add authorized client IPs to '$tuwunel_admin_allowed' for non-OIDC /_tuwunel/ access (404 otherwise).
# - Uncomment the port 8448 server block (and publish 8448:8448/tcp in docker-compose.yaml) only if federation is not delegated to :443 via .well-known.

upstream tuwunel_backend {
    zone tuwunel_backend 64k;
    server matrix-tuwunel:8008 resolve;
    keepalive 64;
}

acme_client tuwunel https://acme-v02.api.letsencrypt.org/directory;

# 1 = allow, 0 = 404
geo $remote_addr $tuwunel_admin_allowed {
    default                 0;
    # 127.0.0.1               1;
    # ::1                     1;
    # 192.168.1.0/24          1;
    # 10.0.0.0/8              1;
    # 2001:db8::/64           1;
}

# 1 = log, 0 = silence
geo $remote_addr $tuwunel_log_ip {
    default                 1;
    # 127.0.0.1               0;
    # ::1                     0;
    # 192.168.1.0/24          0;
    # 10.0.0.0/8              0;
    # 2001:db8::/64           0;
}

map $http_user_agent $tuwunel_log_ua {
    default                 1;
    # ~*Gatus/                0;
    # '~^SchildiChat Next/'   0;
    # '~^Element X/'          0;
}

map $request_uri $tuwunel_log_uri {
    default                                                                    full;
    ~*^/_matrix/client/(?:v3|r0|unstable)/(?:login|register|refresh)(?:/|\?|$) auth;
    ~*^/_tuwunel/oidc(?:/|\?|$)                                                auth;
    ~*^/_matrix/                                                               quiet;
    ~*^/\.well-known/matrix/                                                   quiet;
}

map "$tuwunel_log_ip:$tuwunel_log_ua:$tuwunel_log_uri:$status" $tuwunel_need_log {
    default                           0;
    ~^1:1:full:\d+$                   1;
    ~^1:1:auth:(?:401|403|429|5\d\d)$ 1;
    ~^1:1:quiet:(?:429|5\d\d)$        1;
}

server {
    listen 80;
    server_name tuwunel.example.com;

    acme tuwunel;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen 443 quic;
    server_name tuwunel.example.com;

    acme tuwunel;

    ssl_certificate $acme_cert_tuwunel;
    ssl_certificate_key $acme_cert_key_tuwunel;

    add_header Alt-Svc 'h3=":443"; ma=86400';

    access_log /var/log/angie/domains/tuwunel.example.com.log extended if=$tuwunel_need_log;
    error_log /var/log/angie/domains/tuwunel.example.com.error.log error;

    if ($anti_replay = 307) { return 307 https://$host$request_uri; }
    if ($anti_replay = 425) { return 425; }

    include /etc/angie/conf.d/security-headers.inc;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    include /etc/angie/conf.d/error-pages.inc;

    location ~ /\.(?!well-known\/) {
        return 404;
    }

    location ~* ^/_synapse(?:/|$) {
        return 404;
    }

    location ^~ /.well-known/matrix/ {
        limit_except GET HEAD OPTIONS {
            deny all;
        }

        client_max_body_size 16k;

        proxy_connect_timeout 5s;
        proxy_send_timeout 15s;
        proxy_read_timeout 15s;

        proxy_pass http://tuwunel_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Early-Data $rfc_early_data;
    }

    location ~ ^/\.well-known/(?:openid-configuration|oauth-authorization-server)$ {
        limit_except GET HEAD OPTIONS {
            deny all;
        }

        client_max_body_size 16k;

        proxy_connect_timeout 5s;
        proxy_send_timeout 15s;
        proxy_read_timeout 15s;

        proxy_pass http://tuwunel_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Early-Data $rfc_early_data;
    }

    location ~* ^/_tuwunel/oidc(?:/|$) {
        limit_except GET HEAD POST PUT DELETE OPTIONS {
            deny all;
        }

        client_max_body_size 10m;

        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        proxy_pass http://tuwunel_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Early-Data $rfc_early_data;
    }

    location ~* ^/_tuwunel(?:/|$) {
        if ($tuwunel_admin_allowed = 0) {
            return 404;
        }

        if ($request_method !~ ^(GET|HEAD|POST|PUT|DELETE|OPTIONS)$) {
            return 405;
        }

        client_max_body_size 10m;

        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        proxy_pass http://tuwunel_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Early-Data $rfc_early_data;
    }

    location ^~ /_matrix/ {
        limit_except GET HEAD POST PUT DELETE PATCH OPTIONS {
            deny all;
        }

        client_max_body_size 200m;
        proxy_buffering off;
        proxy_request_buffering off;

        proxy_connect_timeout 10s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;

        proxy_pass http://tuwunel_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Early-Data $rfc_early_data;

        location ~ ^/_matrix/client/(?:unstable/[^/]+|v\d+|r0)/rendezvous(?:/|$) {
            limit_except GET HEAD POST PUT DELETE OPTIONS {
                deny all;
            }

            client_max_body_size 64k;
            charset off;
            gzip off;
            brotli off;
            zstd off;
            proxy_cache off;
            proxy_buffering off;
            proxy_request_buffering off;

            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            proxy_pass http://tuwunel_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Early-Data $rfc_early_data;
        }
    }

    location / {
        return 404;
    }
}

