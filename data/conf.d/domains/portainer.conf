# =============================================================================
# PORTAINER VIRTUAL HOST TEMPLATE (SUB-DIRECTORY)
# =============================================================================
# Hosts Portainer under '/portainer/' with WebSocket terminal/exec support.
#
# Backend Ports:
#   - HTTP (default 9000):  proxy_pass http://portainer_backend/;
#   - HTTPS (default 9443): proxy_pass https://portainer_backend/; proxy_ssl_verify off;
#
# Deployment:
#   - Replace 'portainer.example' with your actual domain name.
#   - Replace 'portainer' with a unique ACME identifier.
#   - Replace 'portainer_backend' with a unique upstream pool name.
#   - To embed into an existing virtual host, copy the upstream and locations.
# =============================================================================

upstream portainer_backend {
    zone portainer_backend 64k;
    server portainer:9000 resolve;
    keepalive 32;
}

acme_client portainer https://acme-v02.api.letsencrypt.org/directory;

server {
    listen 80;
    server_name portainer.example;

    acme portainer;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name portainer.example;

    acme portainer;

    ssl_certificate $acme_cert_portainer;
    ssl_certificate_key $acme_cert_key_portainer;

    access_log /var/log/angie/domains/portainer.example.log extended;
    error_log /var/log/angie/domains/portainer.example.error.log error;

    if ($anti_replay = 307) { return 307 https://$host$request_uri; }
    if ($anti_replay = 425) { return 425; }

    include /etc/angie/conf.d/security-headers.inc;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    include /etc/angie/conf.d/error-pages.inc;

    location = /portainer {
        return 301 /portainer/;
    }

    location ^~ /portainer/ {
        proxy_pass http://portainer_backend/;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Early-Data $rfc_early_data;

        proxy_read_timeout 900s;
        proxy_send_timeout 900s;

        client_max_body_size 512M;

        access_log off;
    }
}
