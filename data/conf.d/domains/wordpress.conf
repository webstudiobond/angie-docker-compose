# =============================================================================
# WORDPRESS VIRTUAL HOST TEMPLATE
# =============================================================================
# Production WordPress template with HTTP/3 (QUIC) and conditional access logging.
#
# Deployment:
#   - Replace 'wordpress.example' with your actual domain name.
#   - Globally replace 'mysite' with your unique site identifier (e.g., 'shop').
#     In Angie, the following are global in the 'http' context and MUST be unique:
#       * ACME client name: mysite
#       * Upstream pool and zone name: mysite_backend
#       * Conditional log geo/map variables: $mysite_log_* and $mysite_need_log
# =============================================================================

upstream mysite_backend {
    zone mysite_backend 64k;
    server mysite_angie:80 resolve;
    keepalive 32;
}

acme_client mysite https://acme-v02.api.letsencrypt.org/directory;

# Conditional Access Logging
# Sample filter rules are commented out by default; uncomment or add entries to silence (0) matching logs.

# Filter by client IP address or CIDR subnet
geo $remote_addr $mysite_log_ip {
    default                 1;
    # 127.0.0.1               0;
    # ::1                     0;
    # 192.168.1.0/24          0;
    # 10.0.0.0/8              0;
    # 2001:db8::/64           0;
}

# Filter by User-Agent (e.g., monitoring probes, uptime bots)
map $http_user_agent $mysite_log_ua {
    default                 1;
    # ~*Uptime-Kuma           0;
    # ~*UptimeRobot           0;
    # ~*BetterStack           0;
    # ~*Pingdom               0;
    # ~*Site24x7              0;
    # ~*StatusCake            0;
}

# Filter by Request URI (e.g., health check endpoints, background cron)
map $request_uri $mysite_log_uri {
    default                 1;
    # ~*^/favicon\.ico        0;
    # ~*^/robots\.txt         0;
    # ~*^/wp-cron\.php        0;
}

# Aggregated logging decision: if any filter evaluates to 0, access logging is suppressed
map "$mysite_log_ip:$mysite_log_ua:$mysite_log_uri" $mysite_need_log {
    default                 1;
    ~0                      0;
}

server {
    listen 80;
    server_name wordpress.example;

    acme mysite;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen 443 quic;
    server_name wordpress.example;

    acme mysite;

    ssl_certificate $acme_cert_mysite;
    ssl_certificate_key $acme_cert_key_mysite;

    add_header Alt-Svc 'h3=":443"; ma=86400';

    access_log /var/log/angie/domains/wordpress.example.log extended if=$mysite_need_log;
    error_log /var/log/angie/domains/wordpress.example.error.log error;

    client_max_body_size 256M;

    if ($anti_replay = 307) { return 307 https://$host$request_uri; }
    if ($anti_replay = 425) { return 425; }

    include /etc/angie/conf.d/security-headers.inc;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    include /etc/angie/conf.d/error-pages.inc;

    location / {
        proxy_pass http://mysite_backend;
        proxy_http_version 1.1;

        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Early-Data $rfc_early_data;

        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}
