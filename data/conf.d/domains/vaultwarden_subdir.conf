# Deployment checklist:
# - Replace 'vault.example' with your target domain.
# - Replace '/vault/' with your desired subpath (must match 'DOMAIN' URL in Vaultwarden config).
# - Add authorized client IPs to '$vaultwarden_admin_allowed' for /admin access.
# - If running multiple instances, replace 'vaultwarden' identifiers to maintain unique zones/variables.

upstream vaultwarden_backend {
    zone vaultwarden_backend 64k;
    server vaultwarden:8080 resolve;
    keepalive 32;
}

acme_client vaultwarden https://acme-v02.api.letsencrypt.org/directory;

map $http_upgrade $vaultwarden_connection_upgrade {
    default upgrade;
    ''      "";
}

# 1 = allow, 0 = 404
geo $remote_addr $vaultwarden_admin_allowed {
    default                 0;
    # 127.0.0.1               1;
    # 192.168.1.0/24          1;
    # 10.0.0.0/8              1;
}

# 1 = log, 0 = silence
geo $remote_addr $vaultwarden_log_ip {
    default                 1;
    # 127.0.0.1               0;
}

map $http_user_agent $vaultwarden_log_ua {
    default                 1;
    # ~*Bitwarden_Mobile/     0;
}

map $request_uri $vaultwarden_log_uri {
    default                 1;
    ~*^/vault/(?:api/|icons/|identity/) 0;
}

map "$vaultwarden_log_ip:$vaultwarden_log_ua:$vaultwarden_log_uri" $vaultwarden_need_log {
    default                 1;
    ~0                      0;
}

server {
    listen 80;
    server_name vault.example;

    acme vaultwarden;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen 443 quic;
    server_name vault.example;

    acme vaultwarden;

    ssl_certificate $acme_cert_vaultwarden;
    ssl_certificate_key $acme_cert_key_vaultwarden;

    add_header Alt-Svc 'h3=":443"; ma=86400';

    access_log /var/log/angie/domains/vault.example.log extended if=$vaultwarden_need_log;
    error_log /var/log/angie/domains/vault.example.error.log error;

    if ($anti_replay = 307) { return 307 https://$host$request_uri; }
    if ($anti_replay = 425) { return 425; }

    include /etc/angie/conf.d/security-headers.inc;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    include /etc/angie/conf.d/error-pages.inc;

    location ~ /\.(?!well-known\/) {
        return 404;
    }

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $vaultwarden_connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header Early-Data $rfc_early_data;

    location ^~ /vault/admin {
        if ($vaultwarden_admin_allowed = 0) {
            return 404;
        }

        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        proxy_pass http://vaultwarden_backend;
    }

    location ^~ /vault/ {
        client_max_body_size 525M;
        proxy_request_buffering off;

        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 3600s;

        proxy_pass http://vaultwarden_backend;
    }

    location / {
        return 404;
    }
}
