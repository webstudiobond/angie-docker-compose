# =============================================================================
# SPEEDYBENCH VIRTUAL HOST TEMPLATE
# =============================================================================
# When deploying SpeedyBench, perform a global replacement:
#   - Replace 'speedybench.example' with your actual domain name.
#
# Note: SpeedyBench serves its own strict Content-Security-Policy directly
# from the Go backend. TLS protocols and ciphers are inherited from angie.conf.
# =============================================================================

acme_client speedybench https://acme-v02.api.letsencrypt.org/directory;

# 1. HTTP Server: ACME challenges & immediate 301 redirect to HTTPS
server {
    listen 80;
    server_name speedybench.example;

    acme speedybench;

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS Server: Production workload
server {
    listen 443 ssl;
    server_name speedybench.example;

    # Disable HTTP/2 and HTTP/3 multiplexing flow control to ensure accurate bandwidth measurements
    http2 off;
    http3 off;

    acme speedybench;

    ssl_certificate $acme_cert_speedybench;
    ssl_certificate_key $acme_cert_key_speedybench;

    access_log off;
    error_log /var/log/angie/domains/speedybench.example.error.log crit;

    client_max_body_size 35M;

    # TLS 1.3 0-RTT anti-replay mitigation
    if ($anti_replay = 307) { return 307 https://$host$request_uri; }
    if ($anti_replay = 425) { return 425; }

    # Universal baseline security headers & HSTS
    include /etc/angie/conf.d/security-headers.inc;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Anonymous perimeter error handler
    include /etc/angie/conf.d/error-pages.inc;

    location / {
        set $upstream http://speedybench:8989;
        proxy_pass $upstream;
        proxy_redirect off;

        # Disable proxy buffering for accurate real-time latency and throughput measurements
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_max_temp_file_size 0;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-NginX-Proxy true;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Early-Data $rfc_early_data;
    }
}
