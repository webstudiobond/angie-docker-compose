# =============================================================================
# MOZILLA AUTOCONFIG VIRTUAL HOST TEMPLATE (STALWART)
# =============================================================================
# Exposes email client autoconfiguration endpoints (Thunderbird, K-9 Mail):
#   - /mail/config-v1.1.xml
#   - /.well-known/autoconfig/mail/config-v1.1.xml
#   - /.well-known/mail-v1.xml
#   - /.well-known/user-agent-configuration.json (IETF PACC)
#
# Deployment:
#   - Replace 'autoconfig.example.com' with your actual autoconfig domain.
#   - Replace 'autoconfig' with a unique ACME identifier.
#   - Replace 'stalwart_autoconfig_backend' with a unique upstream pool name.
# =============================================================================

upstream stalwart_autoconfig_backend {
    zone stalwart_autoconfig_backend 64k;
    server stalwart:8080 resolve;
    keepalive 32;
}

acme_client autoconfig https://acme-v02.api.letsencrypt.org/directory;

server {
    listen 80;
    server_name autoconfig.example.com;

    acme autoconfig;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name autoconfig.example.com;

    acme autoconfig;

    ssl_certificate $acme_cert_autoconfig;
    ssl_certificate_key $acme_cert_key_autoconfig;

    access_log /var/log/angie/domains/autoconfig.example.com.log extended;
    error_log /var/log/angie/domains/autoconfig.example.com.error.log error;

    if ($anti_replay = 307) { return 307 https://$host$request_uri; }
    if ($anti_replay = 425) { return 425; }

    include /etc/angie/conf.d/security-headers.inc;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    include /etc/angie/conf.d/error-pages.inc;

    location ~* ^/(mail/config-v1\.1\.xml|\.well-known/(autoconfig/mail/config-v1\.1\.xml|mail-v1\.xml|user-agent-configuration\.json))$ {
        limit_except GET {
            deny all;
        }

        proxy_pass http://stalwart_autoconfig_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Early-Data $rfc_early_data;

        access_log off;
    }

    location / {
        return 404;
    }
}
