# =============================================================================
# MICROSOFT AUTODISCOVER VIRTUAL HOST TEMPLATE (STALWART)
# =============================================================================
# Exposes email client autodiscovery endpoints (Outlook, Apple Mail):
#   - /autodiscover/autodiscover.xml (v1 XML)
#   - /autodiscover/autodiscover.json (v2 JSON)
#   - /.well-known/user-agent-configuration.json (IETF PACC)
#
# Deployment:
#   - Replace 'autodiscover.example.com' with your actual autodiscover domain.
#   - Replace 'autodiscover' with a unique ACME identifier.
#   - Replace 'stalwart_autodiscover_backend' with a unique upstream pool name.
# =============================================================================

upstream stalwart_autodiscover_backend {
    zone stalwart_autodiscover_backend 64k;
    server stalwart:8080 resolve;
    keepalive 32;
}

acme_client autodiscover https://acme-v02.api.letsencrypt.org/directory;

server {
    listen 80;
    server_name autodiscover.example.com;

    acme autodiscover;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name autodiscover.example.com;

    acme autodiscover;

    ssl_certificate $acme_cert_autodiscover;
    ssl_certificate_key $acme_cert_key_autodiscover;

    access_log /var/log/angie/domains/autodiscover.example.com.log extended;
    error_log /var/log/angie/domains/autodiscover.example.com.error.log error;

    if ($anti_replay = 307) { return 307 https://$host$request_uri; }
    if ($anti_replay = 425) { return 425; }

    include /etc/angie/conf.d/security-headers.inc;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    include /etc/angie/conf.d/error-pages.inc;

    location ~* ^/autodiscover/ {
        limit_except GET POST OPTIONS {
            deny all;
        }

        client_max_body_size 2m;

        proxy_pass http://stalwart_autodiscover_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Early-Data $rfc_early_data;
        access_log off;
    }

    location = /.well-known/user-agent-configuration.json {
        limit_except GET {
            deny all;
        }

        proxy_pass http://stalwart_autodiscover_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Early-Data $rfc_early_data;

        access_log off;
    }

    location / {
        return 404;
    }
}
