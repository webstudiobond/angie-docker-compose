# =============================================================================
# DOMAIN REDIRECT VIRTUAL HOST TEMPLATE
# =============================================================================
# Redirects legacy domains to a new target domain using an external rewrite
# rules file to preserve SEO rankings and migrated URL structures. Malicious
# probes, scripts, and admin scans return 404/403 and are logged for CrowdSec.
#
# Deployment:
#   - Replace 'old-domain.example' with your legacy domain name.
#   - Replace 'old_domain' with a unique ACME identifier.
#   - Replace 'old-domain-redirects.inc' with your redirect rules filename
#     (copied from 'redirect.inc.example').
# =============================================================================

acme_client old_domain https://acme-v02.api.letsencrypt.org/directory;

server {
    listen 80;
    server_name old-domain.example www.old-domain.example;

    acme old_domain;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name old-domain.example www.old-domain.example;

    acme old_domain;

    ssl_certificate $acme_cert_old_domain;
    ssl_certificate_key $acme_cert_key_old_domain;

    access_log /var/log/angie/domains/old-domain.example.log extended;
    error_log /var/log/angie/domains/old-domain.example.error.log error;

    client_max_body_size 1k;

    if ($anti_replay = 307) { return 307 https://$host$request_uri; }
    if ($anti_replay = 425) { return 425; }

    include /etc/angie/conf.d/security-headers.inc;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    include /etc/angie/conf.d/error-pages.inc;

    location ~ /\.(?!well-known\/) {
        return 404;
    }

    location ~* ^/(?:wp-admin|wp-includes|wp-json|administrator|admin|backend|panel|dashboard|cp|bitrix|typo3|phpmyadmin|pma|myadmin|dbadmin|sqladmin|mysql|adminer|pgadmin|manager|cpanel|whm|plesk|directadmin|webmin|hestia|webmail|roundcube|autodiscover|autoconfig|owa|ecp|exchange|activesync|cgi-bin|vendor|node_modules|actuator|console|jolokia|swagger|graphql|_ignition|_profiler|telescope|server-status|server-info|backup|backups|dump|logs|tmp|test|setup|install)(?:/|$) {
        return 404;
    }

    location ~* ^(?!/(?:robots\.txt|sitemap(?:_index)?\.xml)$).*\.(?:php[0-9s]?|phtml|phar|asp|aspx|jsp|jspx|cgi|pl|py|sh|dll|exe|bak|conf|config|dist|fla|in[ci]|log|orig|psd|sql|sqlite|db|sw[op]|tar|tgz|gz|zip|rar|7z|yml|yaml|toml|xml|json|txt|wsdl|pem|key|crt|csr)$ {
        return 404;
    }

    location / {
        if ($request_method !~ ^(GET|HEAD)$) {
            return 403;
        }

        if ($request_uri ~* "(?:\.\./|etc/passwd|union.*select|XDEBUG_SESSION|invokefunction|allow_url_include|auto_prepend_file|base64_|eval\(|<script)") {
            return 403;
        }

        include /etc/angie/conf.d/domains/old-domain-redirects.inc;

        return 404;
    }
}
