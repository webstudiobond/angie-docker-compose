# =============================================================================
# UPTIME KUMA VIRTUAL HOST TEMPLATE (SUB-DIRECTORY)
# =============================================================================
# Hosts Uptime Kuma under '/uptime-kuma/'. Uses built-in 'sub_filter' to rewrite
# root-relative asset paths, WebSocket connections, and ServiceWorker scope.
#
# Deployment:
#   - Replace 'uptime.example' with your actual domain name.
#   - Replace 'uptime_kuma' with a unique ACME identifier.
#   - Replace 'uptime_kuma_backend' with a unique upstream pool name.
#   - To embed into an existing virtual host, copy the upstream and locations.
# =============================================================================

upstream uptime_kuma_backend {
    zone uptime_kuma_backend 64k;
    server uptime-kuma:3001 resolve;
    keepalive 32;
}

acme_client uptime_kuma https://acme-v02.api.letsencrypt.org/directory;

server {
    listen 80;
    server_name uptime.example;

    acme uptime_kuma;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name uptime.example;

    acme uptime_kuma;

    ssl_certificate $acme_cert_uptime_kuma;
    ssl_certificate_key $acme_cert_key_uptime_kuma;

    access_log /var/log/angie/domains/uptime.example.log extended;
    error_log /var/log/angie/domains/uptime.example.error.log error;

    if ($anti_replay = 307) { return 307 https://$host$request_uri; }
    if ($anti_replay = 425) { return 425; }

    include /etc/angie/conf.d/security-headers.inc;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    include /etc/angie/conf.d/error-pages.inc;

    location = /uptime-kuma {
        return 301 /uptime-kuma/;
    }

    location ^~ /uptime-kuma/ {
        set $url_prefix uptime-kuma;

        rewrite ^/uptime-kuma/(.*)$ /$1 break;

        proxy_pass http://uptime_kuma_backend;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Early-Data $rfc_early_data;

        proxy_set_header Accept-Encoding "";

        proxy_redirect / /$url_prefix/;
        proxy_redirect http://$host/ https://$host/$url_prefix/;

        sub_filter_last_modified on;
        sub_filter_once off;
        sub_filter_types *;
        sub_filter '/assets/' '/$url_prefix/assets/';
        sub_filter '"assets/' '"$url_prefix/assets/';
        sub_filter '/socket.io' '/$url_prefix/socket.io';
        sub_filter '/icon.svg' '/$url_prefix/icon.svg';
        sub_filter '/favicon.ico' '/$url_prefix/favicon.ico';
        sub_filter '/apple-touch-icon.png' '/$url_prefix/apple-touch-icon.png';
        sub_filter '/manifest.json' '/$url_prefix/manifest.json';
        sub_filter '/serviceWorker.js' '/$url_prefix/serviceWorker.js';
        sub_filter 'scope: "/"' 'scope: "/$url_prefix/"';
        sub_filter 'scope:"/"' 'scope:"/$url_prefix/"';
        sub_filter "scope: '/'" "scope: '/$url_prefix/'";
        sub_filter "scope:'/'" "scope:'/$url_prefix/'";
        sub_filter '/add' '/$url_prefix/add';
        sub_filter '/settings/' '/$url_prefix/settings/';
        sub_filter '"/settings' '"/$url_prefix/settings';
        sub_filter '/dashboard' '/$url_prefix/dashboard';
        sub_filter '/maintenance' '/$url_prefix/maintenance';
        sub_filter '/add-status-page' '/$url_prefix/add-status-page';
        sub_filter '/manage-status-page' '/$url_prefix/manage-status-page';
        sub_filter '"/status/' '"/$url_prefix/status/';
        sub_filter '/upload/' '/$url_prefix/upload/';
        sub_filter '/api/' '/$url_prefix/api/';

        access_log off;
    }
}
