# =============================================================================
# STALWART MAIL SERVER VIRTUAL HOST TEMPLATE
# =============================================================================
# Exposes email client autodiscovery and JMAP discovery endpoints:
#   - /autodiscover/autodiscover.xml (v1 XML)
#   - /autodiscover/autodiscover.json (v2 JSON)
#   - /.well-known/user-agent-configuration.json (IETF PACC)
#   - /.well-known/jmap (JMAP discovery)
#
# WebUI (/admin, /account) is locked (404) by default. Uncomment the optional
# location block if public management access is required.
#
# Deployment:
#   - Replace 'mail.example.com' with your actual mail server FQDN.
#   - Replace 'stalwart' with a unique ACME identifier.
#   - Replace 'stalwart_backend' with a unique upstream pool name.
# =============================================================================

upstream stalwart_backend {
    zone stalwart_backend 64k;
    server stalwart:8080 resolve;
    keepalive 32;
}

acme_client stalwart https://acme-v02.api.letsencrypt.org/directory;

server {
    listen 80;
    server_name mail.example.com;

    acme stalwart;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name mail.example.com;

    acme stalwart;

    ssl_certificate $acme_cert_stalwart;
    ssl_certificate_key $acme_cert_key_stalwart;

    access_log /var/log/angie/domains/mail.example.com.log extended;
    error_log /var/log/angie/domains/mail.example.com.error.log error;

    if ($anti_replay = 307) { return 307 https://$host$request_uri; }
    if ($anti_replay = 425) { return 425; }

    include /etc/angie/conf.d/security-headers.inc;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    include /etc/angie/conf.d/error-pages.inc;

    location ~* ^/autodiscover/ {
        limit_except GET POST OPTIONS {
            deny all;
        }

        client_max_body_size 2m;

        proxy_pass http://stalwart_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Early-Data $rfc_early_data;

        access_log off;
    }

    location ~* ^/\.well-known/(user-agent-configuration\.json|jmap)$ {
        limit_except GET {
            deny all;
        }

        proxy_pass http://stalwart_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Early-Data $rfc_early_data;

        access_log off;
    }

# Optional: Public Stalwart WebUI (/admin and /account)
# -------------------------------------------------------------------------
# SECURITY WARNING: Exposing the WebUI to the public internet increases attack
# surface. Accessing via SSH tunnel or WireGuard VPN is strongly recommended.
#
# To enable public access to WebUI:
#   1. Uncomment the block below.
#   2. Comment out the 'location / { return 404; }' perimeter lock below.
# -------------------------------------------------------------------------

    # location / {
    #     proxy_pass http://stalwart_backend;
    #     proxy_http_version 1.1;
    #     proxy_set_header Connection "";
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    #     proxy_set_header Early-Data $rfc_early_data;
    #
    #     proxy_set_header Upgrade $http_upgrade;
    #     proxy_set_header Connection "upgrade";
    # }

    location / {
        return 404;
    }
}
