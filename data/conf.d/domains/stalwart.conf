# Deployment checklist:
# - Replace 'mail.example.com' with your actual mail server FQDN.
# - Replace 'stalwart' with a unique ACME identifier.
# - Replace 'stalwart_backend' with a unique upstream pool name.

upstream stalwart_backend {
    zone stalwart_backend 64k;
    server stalwart:8080 resolve;
    keepalive 32;
}

acme_client stalwart https://acme-v02.api.letsencrypt.org/directory;

# 1 = allow, 0 = 404
geo $remote_addr $stalwart_admin_allowed {
    default                 0;
    # 127.0.0.1               1;
    # ::1                     1;
    # 192.168.1.0/24          1;
    # 10.0.0.0/8              1;
    # 2001:db8::/64           1;
}

# 1 = log, 0 = silence
geo $remote_addr $stalwart_log_ip {
    default                 1;
    # 127.0.0.1               0;
    # ::1                     0;
    # 192.168.1.0/24          0;
    # 10.0.0.0/8              0;
    # 2001:db8::/64           0;
}

map $http_user_agent $stalwart_log_ua {
    default                 1;
    # ~*Gatus/                0;
    # ~*Uptime-Kuma           0;
    # ~*UptimeRobot           0;
    # ~*BetterStack           0;
    # ~*Pingdom               0;
    # ~*Site24x7              0;
    # ~*StatusCake            0;
}

map $request_uri $stalwart_log_uri {
    default                 1;
    # ~*^/(healthz|favicon\.ico|robots\.txt)$                        0;
    # ~*^/static/                                                   0;
}

map $remote_user $stalwart_log_user {
    default                 1;
    # "trusted-user"          0;
}

map "$stalwart_log_ip:$stalwart_log_ua:$stalwart_log_uri:$stalwart_log_user" $stalwart_need_log {
    default                 1;
    ~0                      0;
}

server {
    listen 80;
    server_name mail.example.com;

    acme stalwart;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name mail.example.com;

    acme stalwart;

    ssl_certificate $acme_cert_stalwart;
    ssl_certificate_key $acme_cert_key_stalwart;

    access_log /var/log/angie/domains/mail.example.com.log extended if=$stalwart_need_log;
    error_log /var/log/angie/domains/mail.example.com.error.log error;

    if ($anti_replay = 307) { return 307 https://$host$request_uri; }
    if ($anti_replay = 425) { return 425; }

    include /etc/angie/conf.d/security-headers.inc;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    include /etc/angie/conf.d/error-pages.inc;

    # include /etc/angie/conf.d/authelia-internal-verify.inc;
    # include /etc/angie/conf.d/authelia-public-ui.inc;

    location ~* ^/autodiscover/ {
        limit_except GET POST OPTIONS {
            deny all;
        }

        client_max_body_size 2m;

        proxy_pass http://stalwart_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Early-Data $rfc_early_data;

        access_log off;
    }

    location ~* ^/\.well-known/(user-agent-configuration\.json|jmap)$ {
        limit_except GET {
            deny all;
        }

        proxy_pass http://stalwart_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Early-Data $rfc_early_data;

        access_log off;
    }

#     # Optional: Public Stalwart WebUI (/account)
#
#     location ~* ^/(account|login|auth|api|jmap) {
