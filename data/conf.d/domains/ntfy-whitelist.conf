# Deployment checklist:
# - Replace 'ntfy.example' with your target domain.
# - Configure whitelisted topics in '$ntfy_match_uri'.
# - If running multiple instances, replace 'ntfy' identifiers to maintain unique zones/variables.

upstream ntfy_backend {
    zone ntfy_backend 64k;
    server ntfy:8080 resolve;
    keepalive 32;
}

acme_client ntfy https://acme-v02.api.letsencrypt.org/directory;

# 0 = match, 1 = unmatch
geo $remote_addr $ntfy_match_ip {
    default                 1;
    # 127.0.0.1               0;
    # ::1                     0;
    # 10.0.0.0/8              0;
    # 192.168.1.0/24          0;
    # 2001:db8::/64           0;
}

map $http_user_agent $ntfy_match_ua {
    default                 1;
    # ~*^diun/                0;
    # ~*Gatus                 0;
    # ~*Uptime-Kuma           0;
    # ~*UptimeRobot           0;
    # ~*BetterStack           0;
    # ~*Pingdom               0;
    # ~*Site24x7              0;
    # ~*StatusCake            0;
}

map $request_uri $ntfy_match_uri {
    default                 1;

    # Whitelisted topic families including any trailing sub-paths (/.*)?
    ~*^/(ping[^/]*|monit[^/]*|telemetry[^/]*)(/.*)?$                0;

    # Health check endpoint for external monitoring probes (Gatus, Uptime-Kuma, etc.)
    # ~*^/v1/health$                                                0;

    # File attachments download endpoint (uncomment to allow downloading files attached to notifications)
    # Serves uploaded attachment files via /file/<attachment-id>.<ext>
    # ~*^/file/[^/]+$                                               0;

    # Matrix push gateway (uncomment if integrated with Matrix homeserver)
    # ~*^/_matrix/push/v1/notify$                                   0;
}

map "$request_method:$request_uri:$ntfy_match_ua" $ntfy_match_root {
    default                         1;
    ~*^(GET|HEAD|POST|PUT):/:0$     0;
}

# 1 = allow, 0 = 404
map "$ntfy_match_ip:$ntfy_match_uri:$ntfy_match_root" $ntfy_allowed {
    default                         0;
    ~0                              1;
}

# 1 = log, 0 = silence
map "$ntfy_match_ip:$ntfy_match_ua:$ntfy_match_uri" $ntfy_need_log {
    default                 1;
    ~0                      0;
}

server {
    listen 80;
    server_name ntfy.example;

    acme ntfy;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen 443 quic;
    server_name ntfy.example;

    acme ntfy;

    ssl_certificate $acme_cert_ntfy;
    ssl_certificate_key $acme_cert_key_ntfy;

    add_header Alt-Svc 'h3=":443"; ma=86400';

    access_log /var/log/angie/domains/ntfy.example.log extended if=$ntfy_need_log;
    error_log /var/log/angie/domains/ntfy.example.error.log error;

    client_max_body_size 0;

    if ($anti_replay = 307) { return 307 https://$host$request_uri; }
    if ($anti_replay = 425) { return 425; }

    include /etc/angie/conf.d/security-headers.inc;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    include /etc/angie/conf.d/error-pages.inc;

    location ~ /\.(?!well-known\/) {
        return 404;
    }

    location / {
        if ($ntfy_allowed = 0) {
            return 404;
        }

        if ($request_method !~ ^(GET|HEAD|POST|PUT|OPTIONS)$) {
            return 405;
        }

        if ($request_uri ~* "(?:\.\./|etc/passwd|union.*select|XDEBUG_SESSION|invokefunction|allow_url_include|auto_prepend_file|eval\()") {
            return 403;
        }

        proxy_pass http://ntfy_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Early-Data $rfc_early_data;

        proxy_connect_timeout 3m;
        proxy_send_timeout 3m;
        proxy_read_timeout 3m;

        proxy_buffering off;
        proxy_request_buffering off;
    }
}
