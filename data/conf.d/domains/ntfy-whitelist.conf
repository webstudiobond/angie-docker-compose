# =============================================================================
# NTFY WHITELIST / RESTRICTED VIRTUAL HOST TEMPLATE (ZERO-TRUST)
# =============================================================================
# Production ntfy push notification server template enforcing strict topic
# whitelisting (default deny). Blocks Web UI, scanner probes, and unauthorized
# topic enumeration. Returns 404 for all endpoints not explicitly declared
# in the allowlist map.
#
# Deployment:
#   - Replace 'ntfy.example' with your actual domain name.
#   - Globally replace 'ntfy' with your unique service identifier if deploying multiple instances.
#     In Angie, the following are global in the 'http' context and MUST be unique:
#       * ACME client name: ntfy
#       * Upstream pool and zone name: ntfy_backend
#       * Endpoint whitelist map variable: $ntfy_allowed
#       * Conditional log geo/map variables: $ntfy_log_* and $ntfy_need_log
# =============================================================================

upstream ntfy_backend {
    zone ntfy_backend 64k;
    server ntfy:8080 resolve;
    keepalive 32;
}

acme_client ntfy https://acme-v02.api.letsencrypt.org/directory;

# Endpoint & Topic Whitelist (Default Deny)
# Evaluates to 1 for authorized topics and endpoints; all other paths receive 404.
map $request_uri $ntfy_allowed {
    default                 0;

    # Whitelisted topic families including any trailing sub-paths (/.*)?
    ~*^/(ping[^/]*|monit[^/]*|telemetry[^/]*)(/.*)?$                1;

    # File attachments download endpoint (uncomment to allow downloading files attached to notifications)
    # Serves uploaded attachment files via /file/<attachment-id>.<ext>
    # ~*^/file/[^/]+$                                               1;

    # Matrix push gateway (uncomment if integrated with Matrix homeserver)
    # ~*^/_matrix/push/v1/notify$                                   1;
}

# Conditional Access Logging
# Sample filter rules are commented out by default; uncomment or add entries to silence (0) matching logs.

# Filter by client IP address or CIDR subnet
geo $remote_addr $ntfy_log_ip {
    default                 1;
    # 127.0.0.1               0;
    # ::1                     0;
    # 192.168.1.0/24          0;
    # 10.0.0.0/8              0;
    # 2001:db8::/64           0;
}

# Filter by User-Agent (e.g., monitoring probes, uptime bots)
map $http_user_agent $ntfy_log_ua {
    default                 1;
    # ~*Uptime-Kuma           0;
    # ~*UptimeRobot           0;
    # ~*BetterStack           0;
    # ~*Pingdom               0;
    # ~*Site24x7              0;
    # ~*StatusCake            0;
}

# Filter by Request URI (e.g., push gateways, high-frequency topics)
map $request_uri $ntfy_log_uri {
    default                 1;
    # ~*^/_matrix/push/v1/notify$                                   0;
    # Match topic families by prefix (e.g. ping*, monit*, telemetry*) including any trailing sub-paths (/.*)?
    # ~*^/(ping[^/]*|monit[^/]*|telemetry[^/]*)(/.*)?$              0;
}

# Aggregated logging decision: if any filter evaluates to 0, access logging is suppressed
map "$ntfy_log_ip:$ntfy_log_ua:$ntfy_log_uri" $ntfy_need_log {
    default                 1;
    ~0                      0;
}

server {
    listen 80;
    server_name ntfy.example;

    acme ntfy;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen 443 quic;
    server_name ntfy.example;

    acme ntfy;

    ssl_certificate $acme_cert_ntfy;
    ssl_certificate_key $acme_cert_key_ntfy;

    add_header Alt-Svc 'h3=":443"; ma=86400';

    access_log /var/log/angie/domains/ntfy.example.log extended if=$ntfy_need_log;
    error_log /var/log/angie/domains/ntfy.example.error.log error;

    client_max_body_size 0;

    if ($anti_replay = 307) { return 307 https://$host$request_uri; }
    if ($anti_replay = 425) { return 425; }

    include /etc/angie/conf.d/security-headers.inc;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    include /etc/angie/conf.d/error-pages.inc;

    location ~ /\.(?!well-known\/) {
        return 404;
    }

    location / {
        if ($ntfy_allowed = 0) {
            return 404;
        }

        if ($request_method !~ ^(GET|HEAD|POST|PUT|OPTIONS)$) {
            return 405;
        }

        if ($request_uri ~* "(?:\.\./|etc/passwd|union.*select|XDEBUG_SESSION|invokefunction|allow_url_include|auto_prepend_file|eval\()") {
            return 403;
        }

        proxy_pass http://ntfy_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Early-Data $rfc_early_data;

        proxy_connect_timeout 3m;
        proxy_send_timeout 3m;
        proxy_read_timeout 3m;

        proxy_buffering off;
        proxy_request_buffering off;
    }
}
