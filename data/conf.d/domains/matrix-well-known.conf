# Deployment checklist:
# - Replace 'example.com' with your Matrix server_name apex domain.
# - Replace 'matrix_well_known' with a unique ACME identifier if running multiple instances.
# - Replace 'matrix_well_known_backend' with a unique upstream pool name if running multiple instances.
# - If 'example.com' is already configured in another domain file, remove this file and add the 'location ^~ /.well-known/matrix/' block inside that existing server block to avoid duplicate server_name conflicts.

upstream matrix_well_known_backend {
    zone matrix_well_known_backend 64k;
    server matrix-tuwunel:8008 resolve;
    keepalive 16;
}

acme_client matrix_well_known https://acme-v02.api.letsencrypt.org/directory;

# 1 = log, 0 = silence
geo $remote_addr $matrix_well_known_log_ip {
    default                 1;
    # 127.0.0.1               0;
    # ::1                     0;
    # 192.168.1.0/24          0;
    # 10.0.0.0/8              0;
    # 2001:db8::/64           0;
}

map $http_user_agent $matrix_well_known_log_ua {
    default                 1;
    # ~*Gatus/                0;
    # ~*Uptime-Kuma           0;
    # ~*UptimeRobot           0;
    # ~*BetterStack           0;
    # ~*Pingdom               0;
    # ~*Site24x7              0;
    # ~*StatusCake            0;
}

map $request_uri $matrix_well_known_log_uri {
    default                 1;
    # ~*^/\.well-known/matrix/                                   0;
}

map "$matrix_well_known_log_ip:$matrix_well_known_log_ua:$matrix_well_known_log_uri" $matrix_well_known_need_log {
    default                 1;
    ~0                      0;
}

server {
    listen 80;
    server_name example.com;

    acme matrix_well_known;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen 443 quic;
    server_name example.com;

    acme matrix_well_known;

    ssl_certificate $acme_cert_matrix_well_known;
    ssl_certificate_key $acme_cert_key_matrix_well_known;

    add_header Alt-Svc 'h3=":443"; ma=86400';

    access_log /var/log/angie/domains/example.com.log extended if=$matrix_well_known_need_log;
    error_log /var/log/angie/domains/example.com.error.log error;

    if ($anti_replay = 307) { return 307 https://$host$request_uri; }
    if ($anti_replay = 425) { return 425; }

    include /etc/angie/conf.d/security-headers.inc;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    include /etc/angie/conf.d/error-pages.inc;

    location ~ /\.(?!well-known\/) {
        return 404;
    }

    location ^~ /.well-known/matrix/ {
        limit_except GET HEAD OPTIONS {
            deny all;
        }

        client_max_body_size 16k;

        proxy_connect_timeout 5s;
        proxy_send_timeout 15s;
        proxy_read_timeout 15s;

        proxy_pass http://matrix_well_known_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Early-Data $rfc_early_data;
    }

    location / {
        return 404;
    }
}
