upstream hass {
    zone hass 64k;
    server 10.8.0.2:8123;
    keepalive 32;
}

acme_client hass https://acme-v02.api.letsencrypt.org/directory;

map $http_upgrade $hass_connection_upgrade {
    default upgrade;
    ''      "";
}

geo $remote_addr $hass_log_ip {
    default 1;
    127.0.0.1 0;
    ::1 0;
}

map $http_user_agent $hass_log_ua {
    default 1;
    # "~*Home\ Assistant/" 0;
}

map $request_uri $hass_log_uri {
    default 1;
    ~*^/(?:api/|auth/|static/|frontend_latest/|hacsfiles/|community/|local/|route/|lovelace/|map/|energy/|logbook/|history/|config/|developer-tools/|calendar/|hacs/|media-browser/|manifest\.json|sw-modern\.js) 0;
}

map $remote_user $hass_log_user {
    default 1;
}

map "$hass_log_ip:$hass_log_ua:$hass_log_uri:$hass_log_user" $hass_need_log {
    default 1;
    ~0      0;
}

server {
    listen 80;
    server_name hass.example;

    acme hass;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen 443 quic;
    server_name hass.example;

    acme hass;

    ssl_certificate $acme_cert_hass;
    ssl_certificate_key $acme_cert_key_hass;

    add_header Alt-Svc 'h3=":443"; ma=86400';

    access_log /var/log/angie/domains/hass.example.log extended if=$hass_need_log;
    error_log /var/log/angie/domains/hass.example.error.log error;

    if ($anti_replay = 307) { return 307 https://$host$request_uri; }
    if ($anti_replay = 425) { return 425; }

    include /etc/angie/conf.d/security-headers.inc;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    include /etc/angie/conf.d/error-pages.inc;

    location ~ /\.(?!well-known\/) {
        return 404;
    }

    location / {
        proxy_pass http://hass;
        proxy_redirect off;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $http_host;
        proxy_set_header X-NginX-Proxy true;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $hass_connection_upgrade;
        proxy_set_header Early-Data $rfc_early_data;
        proxy_cookie_flags ~ secure;
        proxy_buffering off;
    }
}
