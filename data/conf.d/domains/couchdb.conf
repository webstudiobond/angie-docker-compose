# Deployment checklist:
# - Replace 'couchdb.example' with your target domain.
# - If running multiple instances, replace 'couchdb' identifiers to maintain unique zones/variables.

upstream couchdb_backend {
    zone couchdb_backend 64k;
    server couchdb:5984 resolve;
    keepalive 32;
}

acme_client couchdb https://acme-v02.api.letsencrypt.org/directory;

# 1 = log, 0 = silence
geo $remote_addr $couchdb_log_ip {
    default                 1;
    # 127.0.0.1               0;
    # ::1                     0;
    # 192.168.1.0/24          0;
    # 10.0.0.0/8              0;
    # 2001:db8::/64           0;
}

map $http_user_agent $couchdb_log_ua {
    default                 1;
    # ~*Gatus/                0;
    # ~*Uptime-Kuma           0;
    # ~*UptimeRobot           0;
    # ~*BetterStack           0;
    # ~*Pingdom               0;
    # ~*Site24x7              0;
    # ~*StatusCake            0;
}

map $request_uri $couchdb_log_uri {
    default                 1;
    # ~*^/_up$                0;
    # ~*^/favicon\.ico$       0;
    # ~*^/robots\.txt$        0;
}

map "$couchdb_log_ip:$couchdb_log_ua:$couchdb_log_uri" $couchdb_need_log {
    default                 1;
    ~0                      0;
}

server {
    listen 80;
    server_name couchdb.example;

    acme couchdb;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen 443 quic;
    server_name couchdb.example;

    acme couchdb;

    ssl_certificate $acme_cert_couchdb;
    ssl_certificate_key $acme_cert_key_couchdb;

    add_header Alt-Svc 'h3=":443"; ma=86400';

    access_log /var/log/angie/domains/couchdb.example.log extended if=$couchdb_need_log;
    error_log /var/log/angie/domains/couchdb.example.error.log error;

    client_max_body_size 500m;

    if ($anti_replay = 307) { return 307 https://$host$request_uri; }
    if ($anti_replay = 425) { return 425; }

    include /etc/angie/conf.d/security-headers.inc;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    include /etc/angie/conf.d/error-pages.inc;

    # include /etc/angie/conf.d/authelia-internal-verify.inc;
    # include /etc/angie/conf.d/authelia-public-ui.inc;

    location ~ /\.(?!well-known\/) {
        return 404;
    }

    location / {
        # include /etc/angie/conf.d/authelia-protect.inc;
        # include /etc/angie/conf.d/authelia-user-claims.inc;

        if ($request_method !~ ^(GET|HEAD|POST|PUT|DELETE|OPTIONS|COPY)$) {
            return 405;
        }

        proxy_pass http://couchdb_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Early-Data $rfc_early_data;

        proxy_set_header Connection "";

        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 3600s;

        proxy_buffering off;
        proxy_request_buffering off;
    }
}
