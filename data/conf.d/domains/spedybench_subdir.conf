# =============================================================================
# SPEEDYBENCH VIRTUAL HOST TEMPLATE (SUB-DIRECTORY)
# =============================================================================
# Hosts SpeedyBench under '/speedybench/'. HTTP/2 and HTTP/3 are disabled to
# measure accurate raw TCP/HTTP throughput without multiplexing overhead.
#
# Deployment:
#   - Replace 'speedybench.example' with your actual domain name.
#   - Replace 'speedybench' with a unique ACME identifier.
#   - Replace 'speedybench_backend' with a unique upstream pool name.
#   - To embed into an existing virtual host, copy the upstream and locations.
# =============================================================================

upstream speedybench_backend {
    zone speedybench_backend 64k;
    server speedybench:8989 resolve;
    keepalive 32;
}

acme_client speedybench https://acme-v02.api.letsencrypt.org/directory;

server {
    listen 80;
    server_name speedybench.example;

    acme speedybench;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name speedybench.example;

    http2 off;
    http3 off;

    acme speedybench;

    ssl_certificate $acme_cert_speedybench;
    ssl_certificate_key $acme_cert_key_speedybench;

    access_log /var/log/angie/domains/speedybench.example.log extended;
    error_log /var/log/angie/domains/speedybench.example.error.log error;

    if ($anti_replay = 307) { return 307 https://$host$request_uri; }
    if ($anti_replay = 425) { return 425; }

    include /etc/angie/conf.d/security-headers.inc;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    include /etc/angie/conf.d/error-pages.inc;

    location = /speedybench {
        return 301 /speedybench/;
    }

    location ^~ /speedybench/ {
        proxy_pass http://speedybench_backend/;
        proxy_redirect off;

        proxy_buffering off;
        proxy_request_buffering off;
        proxy_max_temp_file_size 0;

        client_max_body_size 35M;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-NginX-Proxy true;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Early-Data $rfc_early_data;

        access_log off;
    }
}
