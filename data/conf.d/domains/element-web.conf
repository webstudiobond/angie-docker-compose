# Deployment checklist:
# - Replace 'element.example.com' with your Element Web FQDN (must match TUWUNEL_AUTHENTICATION__OIDC__REGISTRATION_ALLOWED_REDIRECT_HOSTS).
# - Replace 'element_web' with a unique ACME identifier if running multiple instances.
# - Replace 'element_web_backend' with a unique upstream pool name if running multiple instances.
# - Ensure Element Web runs on a separate subdomain from Tuwunel ('element.example.com' vs 'tuwunel.example.com') to isolate browser origins.
# - If enabling the optional strict Content-Security-Policy-Report-Only below, adjust the homeserver, .well-known, MatrixRTC, IdP, and map tile origins in both blocks and test in browser DevTools before enforcing.

upstream element_web_backend {
    zone element_web_backend 64k;
    server matrix-element-web:8080 resolve;
    keepalive 32;
}

acme_client element_web https://acme-v02.api.letsencrypt.org/directory;

# 1 = log, 0 = silence
geo $remote_addr $element_web_log_ip {
    default                 1;
    # 127.0.0.1               0;
    # ::1                     0;
    # 192.168.1.0/24          0;
    # 10.0.0.0/8              0;
    # 2001:db8::/64           0;
}

map $http_user_agent $element_web_log_ua {
    default                 1;
    # ~*Gatus/                0;
    # ~*Uptime-Kuma           0;
    # ~*UptimeRobot           0;
    # ~*BetterStack           0;
    # ~*Pingdom               0;
    # ~*Site24x7              0;
    # ~*StatusCake            0;
}

map $request_uri $element_web_log_uri {
    default                 1;
    # ~*^/(?:bundles|fonts|i18n|img|vector-icons)/                0;
    # ~*^/(?:favicon\.ico|manifest\.json)$                        0;
}

map "$element_web_log_ip:$element_web_log_ua:$element_web_log_uri" $element_web_need_log {
    default                 1;
    ~0                      0;
}

server {
    listen 80;
    server_name element.example.com;

    acme element_web;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen 443 quic;
    server_name element.example.com;

    acme element_web;

    ssl_certificate $acme_cert_element_web;
    ssl_certificate_key $acme_cert_key_element_web;

    add_header Alt-Svc 'h3=":443"; ma=86400';

    access_log /var/log/angie/domains/element.example.com.log extended if=$element_web_need_log;
    error_log /var/log/angie/domains/element.example.com.error.log error;

    client_max_body_size 1m;

    if ($anti_replay = 307) { return 307 https://$host$request_uri; }
    if ($anti_replay = 425) { return 425; }

    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-XSS-Protection;
    proxy_hide_header Content-Security-Policy;

    include /etc/angie/conf.d/security-headers.inc;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "frame-ancestors 'self'; object-src 'none'; base-uri 'self'; upgrade-insecure-requests;" always;
    # Optional strict CSP (Report-Only testing mode: replace example domains, enable here and in the no-store location block below, then rename to Content-Security-Policy once DevTools Console is clean):
    # add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' 'unsafe-inline' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://tuwunel.example.com https://api.maptiler.com; font-src 'self' data:; connect-src 'self' https://tuwunel.example.com https://example.com https://matrix-rtc.example.com wss://matrix-rtc.example.com https://api.maptiler.com; media-src 'self' blob: https://tuwunel.example.com; worker-src 'self' blob:; frame-src 'self' blob:; form-action 'self' https://tuwunel.example.com https://auth.example.com;" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive, noimageindex" always;

    include /etc/angie/conf.d/error-pages.inc;

    location ~ /\.(?!well-known\/) {
        return 404;
    }

    location ~* ^/(?:$|index\.html$|version$|i18n/|config(?:\.[^/]+)?\.json$) {
        limit_except GET HEAD OPTIONS {
            deny all;
        }

        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        proxy_no_cache 1;
        proxy_cache_bypass 1;

        include /etc/angie/conf.d/security-headers.inc;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Alt-Svc 'h3=":443"; ma=86400';
        add_header Content-Security-Policy "frame-ancestors 'self'; object-src 'none'; base-uri 'self'; upgrade-insecure-requests;" always;
        # Optional strict CSP (must match the server block above; rename to Content-Security-Policy once DevTools Console is clean):
        # add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' 'unsafe-inline' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://tuwunel.example.com https://api.maptiler.com; font-src 'self' data:; connect-src 'self' https://tuwunel.example.com https://example.com https://matrix-rtc.example.com wss://matrix-rtc.example.com https://api.maptiler.com; media-src 'self' blob: https://tuwunel.example.com; worker-src 'self' blob:; frame-src 'self' blob:; form-action 'self' https://tuwunel.example.com https://auth.example.com;" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive, noimageindex" always;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;

        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        proxy_pass http://element_web_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Early-Data $rfc_early_data;
    }

    location / {
        limit_except GET HEAD OPTIONS {
            deny all;
        }

        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        proxy_pass http://element_web_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Early-Data $rfc_early_data;
    }
}
