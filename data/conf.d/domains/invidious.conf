# Deployment checklist:
# - Replace 'invidious.example' with your target domain.
# - If running multiple instances, replace 'invidious' identifiers to maintain unique zones/variables.

upstream invidious_backend {
    zone invidious_backend 64k;
    server invidious:3000 resolve;
    keepalive 32;
}

acme_client invidious https://acme-v02.api.letsencrypt.org/directory;

# 1 = log, 0 = silence
geo $remote_addr $invidious_log_ip {
    default                 1;
    # 127.0.0.1               0;
    # ::1                     0;
}

map $http_user_agent $invidious_log_ua {
    default                 1;
    # ~*Gatus/                0;
}

map $request_uri $invidious_log_uri {
    default                 1;
    # ~*^/api/v1/stats$       0;
    # ~*^/favicon\.ico$       0;
    # ~*^/robots\.txt$        0;
}

map "$invidious_log_ip:$invidious_log_ua:$invidious_log_uri" $invidious_need_log {
    default                 1;
    ~0                      0;
}

server {
    listen 80;
    server_name invidious.example;

    acme invidious;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen 443 quic;
    server_name invidious.example;

    acme invidious;

    ssl_certificate $acme_cert_invidious;
    ssl_certificate_key $acme_cert_key_invidious;

    add_header Alt-Svc 'h3=":443"; ma=86400';

    access_log /var/log/angie/domains/invidious.example.log extended if=$invidious_need_log;
    error_log /var/log/angie/domains/invidious.example.error.log error;

    client_max_body_size 10m;

    if ($anti_replay = 307) { return 307 https://$host$request_uri; }
    if ($anti_replay = 425) { return 425; }

    include /etc/angie/conf.d/security-headers.inc;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    include /etc/angie/conf.d/error-pages.inc;

    # include /etc/angie/conf.d/authelia-internal-verify-basic-auth.inc;
    # include /etc/angie/conf.d/authelia-public-ui.inc;

    location ~ /\.(?!well-known\/) {
        return 404;
    }

    location / {
        # include /etc/angie/conf.d/authelia-protect.inc;

        proxy_pass http://invidious_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Early-Data $rfc_early_data;

        proxy_set_header Connection "";

        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;

        proxy_buffering off;
        proxy_request_buffering off;
    }
}
