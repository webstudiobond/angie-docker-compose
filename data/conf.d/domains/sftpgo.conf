# Deployment checklist:
# - Replace 'sftp.example' with your target domain.
# - Customize WebClient and WebDAV subpaths as needed (defaults: '/portal/' and '/dav/').
# - Add authorized client IPs to '$sftpgo_admin_allowed' if WebAdmin is enabled.
# - If running multiple instances, replace 'sftpgo' identifiers to maintain unique zones/variables.

upstream sftpgo_webclient {
    zone sftpgo_webclient 64k;
    server sftpgo-app:8080 resolve;
    keepalive 32;
}

upstream sftpgo_webdav {
    zone sftpgo_webdav 64k;
    server sftpgo-app:8090 resolve;
    keepalive 32;
}

# Optional: Private WebAdmin upstream (if exposed via reverse proxy)
# upstream sftpgo_webadmin {
#     zone sftpgo_webadmin 64k;
#     server sftpgo-app:8081 resolve;
#     keepalive 32;
# }

acme_client sftpgo https://acme-v02.api.letsencrypt.org/directory;

# 1 = allow, 0 = 404
geo $remote_addr $sftpgo_admin_allowed {
    default                 0;
    # 127.0.0.1               1;
    # ::1                     1;
    # 192.168.1.0/24          1;
    # 10.0.0.0/8              1;
    # 2001:db8::/64           1;
}

# 1 = log, 0 = silence
geo $remote_addr $sftpgo_log_ip {
    default                 1;
    # 127.0.0.1               0;
    # ::1                     0;
    # 192.168.1.0/24          0;
    # 10.0.0.0/8              0;
    # 2001:db8::/64           0;
}

map $http_user_agent $sftpgo_log_ua {
    default                 1;
    # ~*Gatus/                0;
    # ~*Uptime-Kuma           0;
    # ~*UptimeRobot           0;
    # ~*BetterStack           0;
    # ~*Pingdom               0;
    # ~*Site24x7              0;
    # ~*StatusCake            0;
}

map $request_uri $sftpgo_log_uri {
    default                 1;
    # ~*^/(healthz|favicon\.ico|robots\.txt)$                        0;
    # ~*^/static/                                                   0;
}

map $remote_user $sftpgo_log_user {
    default                 1;
    # "trusted-user"          0;
}

map "$sftpgo_log_ip:$sftpgo_log_ua:$sftpgo_log_uri:$sftpgo_log_user" $sftpgo_need_log {
    default                 1;
    ~0                      0;
}

server {
    listen 80;
    server_name sftp.example;

    acme sftpgo;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen 443 quic;
    server_name sftp.example;

    acme sftpgo;

    ssl_certificate $acme_cert_sftpgo;
    ssl_certificate_key $acme_cert_key_sftpgo;

    add_header Alt-Svc 'h3=":443"; ma=86400';

    access_log /var/log/angie/domains/sftp.example.log extended if=$sftpgo_need_log;
    error_log /var/log/angie/domains/sftp.example.error.log error;

    client_max_body_size 0;

    if ($anti_replay = 307) { return 307 https://$host$request_uri; }
    if ($anti_replay = 425) { return 425; }

    include /etc/angie/conf.d/security-headers.inc;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; media-src 'self'; object-src 'none'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests;" always;

    include /etc/angie/conf.d/error-pages.inc;

    # include /etc/angie/conf.d/authelia-internal-verify.inc;
    # include /etc/angie/conf.d/authelia-public-ui.inc;

    location ~ /\.(?!well-known\/) {
        return 404;
    }

    location ^~ /portal/ {
        proxy_pass http://sftpgo_webclient;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Early-Data $rfc_early_data;

        proxy_request_buffering off;

        proxy_connect_timeout 60s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
    }

    location ^~ /dav/ {
        proxy_pass http://sftpgo_webdav;
        proxy_http_version 1.1;

        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Early-Data $rfc_early_data;

        proxy_request_buffering off;
        proxy_buffering off;

        proxy_connect_timeout 60s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
    }

    # location ^~ /portal/web/admin {
    #     # include /etc/angie/conf.d/authelia-protect.inc;
    #
    #     if ($sftpgo_admin_allowed = 0) {
    #         return 404;
    #     }
    #
    #     proxy_pass http://sftpgo_webadmin;
    #     proxy_http_version 1.1;
    #
    #     proxy_set_header Connection "";
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    #     proxy_set_header X-Forwarded-Host $host;
    #     proxy_set_header X-Forwarded-Port $server_port;
    #     proxy_set_header Early-Data $rfc_early_data;
    #
    #     proxy_connect_timeout 60s;
    #     proxy_send_timeout 300s;
    #     proxy_read_timeout 300s;
    # }

    location / {
        return 404;
    }
}
