# =============================================================================
# SFTPGO VIRTUAL HOST TEMPLATE (HARDENED / ZERO-TRUST)
# =============================================================================
# Production SFTPGo reverse proxy template with HTTP/3 (QUIC) and perimeter lockdown:
#   - Root endpoint (/) returns 404 by default to block scanners and discovery probes.
#   - WebClient served under dedicated subpath (default: /portal/).
#   - WebDAV file transfers served under configurable subpath (default: /dav/).
#   - Optional WebAdmin console (port 8081) commented out with IP geo-allowlist.
#
# Hardening Recommendations:
#   1. Obfuscate subpaths in production:
#      - Change '/dav/' in this file and SFTPGO_WEBDAVD__BINDINGS__0__PREFIX in .env
#        to an unpredictable custom path (e.g., '/storage-dav/').
#      - Change '/portal/' in this file and SFTPGO_HTTPD__WEB_ROOT in .env
#        to an unpredictable custom path (e.g., '/my-portal/').
#   2. Keep WebAdmin strictly internal:
#      - Prefer accessing WebAdmin via SSH tunnel (127.0.0.1:54480) or WireGuard.
#      - If exposed via proxy, uncomment the upstream and location, and declare
#        trusted IP addresses in the $sftpgo_admin_allowed geo block.
#
# Deployment:
#   - Replace 'sftp.example' with your actual domain name.
#   - Globally replace 'sftpgo' with your unique service identifier if needed:
#     In Angie, the following are global in the 'http' context and MUST be unique:
#       * ACME client name: sftpgo
#       * Upstream pool and zone names: sftpgo_webclient, sftpgo_webdav, sftpgo_webadmin
#       * Policy decision geo/map variables: $sftpgo_admin_allowed, $sftpgo_log_*, $sftpgo_need_log
# =============================================================================

upstream sftpgo_webclient {
    zone sftpgo_webclient 64k;
    server sftpgo-app:8080 resolve;
    keepalive 32;
}

upstream sftpgo_webdav {
    zone sftpgo_webdav 64k;
    server sftpgo-app:8090 resolve;
    keepalive 32;
}

# Optional: Private WebAdmin upstream (if exposed via reverse proxy)
# upstream sftpgo_webadmin {
#     zone sftpgo_webadmin 64k;
#     server sftpgo-app:8081 resolve;
#     keepalive 32;
# }

acme_client sftpgo https://acme-v02.api.letsencrypt.org/directory;

# -----------------------------------------------------------------------------
# Administrative Access Control (Geo IP Allowlist)
# -----------------------------------------------------------------------------
# Match trusted client IPs allowed to access the WebAdmin console (1 = allow, 0 = 404).
# Only active if the optional WebAdmin location block is uncommented below.
geo $remote_addr $sftpgo_admin_allowed {
    default                 0;
    # 127.0.0.1               1;
    # ::1                     1;
    # 192.168.1.0/24          1;
    # 10.0.0.0/8              1;
    # 2001:db8::/64           1;
}

# -----------------------------------------------------------------------------
# Conditional Access Logging
# -----------------------------------------------------------------------------
# Sample filter rules are commented out by default; uncomment or add entries to silence (0) matching logs.

# Filter by client IP address or CIDR subnet
geo $remote_addr $sftpgo_log_ip {
    default                 1;
    # 127.0.0.1               0;
    # ::1                     0;
    # 192.168.1.0/24          0;
    # 10.0.0.0/8              0;
    # 2001:db8::/64           0;
}

# Filter by User-Agent (e.g., monitoring probes, uptime bots)
map $http_user_agent $sftpgo_log_ua {
    default                 1;
    # ~*Gatus/                0;
    # ~*Uptime-Kuma           0;
    # ~*UptimeRobot           0;
    # ~*BetterStack           0;
    # ~*Pingdom               0;
    # ~*Site24x7              0;
    # ~*StatusCake            0;
}

# Filter by Request URI (e.g., static assets, health checks)
map $request_uri $sftpgo_log_uri {
    default                 1;
    # ~*^/(healthz|favicon\.ico|robots\.txt)$                        0;
    # ~*^/static/                                                   0;
}

# Filter by authenticated user (e.g., trusted sync accounts)
map $remote_user $sftpgo_log_user {
    default                 1;
    # "trusted-user"          0;
}

# Aggregated logging decision: if any filter evaluates to 0, access logging is suppressed
map "$sftpgo_log_ip:$sftpgo_log_ua:$sftpgo_log_uri:$sftpgo_log_user" $sftpgo_need_log {
    default                 1;
    ~0                      0;
}

server {
    listen 80;
    server_name sftp.example;

    acme sftpgo;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen 443 quic;
    server_name sftp.example;

    acme sftpgo;

    ssl_certificate $acme_cert_sftpgo;
    ssl_certificate_key $acme_cert_key_sftpgo;

    add_header Alt-Svc 'h3=":443"; ma=86400';

    access_log /var/log/angie/domains/sftp.example.log extended if=$sftpgo_need_log;
    error_log /var/log/angie/domains/sftp.example.error.log error;

    client_max_body_size 0;

    if ($anti_replay = 307) { return 307 https://$host$request_uri; }
    if ($anti_replay = 425) { return 425; }

    include /etc/angie/conf.d/security-headers.inc;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; media-src 'self'; object-src 'none'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests;" always;

    include /etc/angie/conf.d/error-pages.inc;

    location ~ /\.(?!well-known\/) {
        return 404;
    }

    location ^~ /portal/ {
        proxy_pass http://sftpgo_webclient;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Early-Data $rfc_early_data;

        proxy_request_buffering off;

        proxy_connect_timeout 60s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
    }

    location ^~ /dav/ {
        proxy_pass http://sftpgo_webdav;
        proxy_http_version 1.1;

        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Early-Data $rfc_early_data;

        proxy_request_buffering off;
        proxy_buffering off;

        proxy_connect_timeout 60s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
    }

    # location ^~ /portal/web/admin {
    #     if ($sftpgo_admin_allowed = 0) {
    #         return 404;
    #     }
    #
    #     proxy_pass http://sftpgo_webadmin;
    #     proxy_http_version 1.1;
    #
    #     proxy_set_header Connection "";
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    #     proxy_set_header X-Forwarded-Host $host;
    #     proxy_set_header X-Forwarded-Port $server_port;
    #     proxy_set_header Early-Data $rfc_early_data;
    #
    #     proxy_connect_timeout 60s;
    #     proxy_send_timeout 300s;
    #     proxy_read_timeout 300s;
    # }

    location / {
        return 404;
    }
}
