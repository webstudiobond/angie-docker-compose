upstream luci {
    zone luci 64k;
    server 127.0.0.1:8080;
    keepalive 32;
}

acme_client openwrt https://acme-v02.api.letsencrypt.org/directory;

map $http_upgrade $luci_connection_upgrade {
    default upgrade;
    ''      "";
}

geo $remote_addr $luci_admin_allowed {
    default 0;
    127.0.0.1 1;
    ::1 1;
}

geo $remote_addr $luci_log_ip {
    default 1;
    127.0.0.1 0;
    ::1 0;
}

map $http_user_agent $luci_log_ua {
    default 1;
}

map $request_uri $luci_log_uri {
    default                           1;
    ~*^/(?:luci-static/|cgi-bin/|ubus/) 0;
}

map $remote_user $luci_log_user {
    default 1;
}

map "$luci_log_ip:$luci_log_ua:$luci_log_uri:$luci_log_user" $luci_need_log {
    default 1;
    ~0      0;
}

server {
    listen 80;
    server_name openwrt.example;

    acme openwrt;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen 443 quic;
    server_name openwrt.example;

    acme openwrt;

    ssl_certificate $acme_cert_openwrt;
    ssl_certificate_key $acme_cert_key_openwrt;

    add_header Alt-Svc 'h3=":443"; ma=86400';

    access_log /var/log/angie/domains/openwrt.example.log extended if=$luci_need_log;
    error_log /var/log/angie/domains/openwrt.example.error.log error;

    if ($anti_replay = 307) { return 307 https://$host$request_uri; }
    if ($anti_replay = 425) { return 425; }

    include /etc/angie/conf.d/security-headers.inc;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    include /etc/angie/conf.d/error-pages.inc;

    include /etc/angie/conf.d/authelia-internal-verify.inc;
    include /etc/angie/conf.d/authelia-public-ui.inc;

    location ~ /\.(?!well-known\/) {
        return 404;
    }

    location ~ ^/(?:cgi-bin/|ubus/|luci-static/) {
        if ($luci_admin_allowed = 0) {
            return 404;
        }

        include /etc/angie/conf.d/authelia-protect.inc;

        proxy_pass http://luci;
        proxy_redirect off;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $http_host;
        proxy_set_header X-NginX-Proxy true;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $luci_connection_upgrade;
        proxy_set_header Early-Data $rfc_early_data;
        proxy_cookie_flags ~ secure;
    }

    location / {
        return 404;
    }
}
