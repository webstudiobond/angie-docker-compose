# Deployment checklist:
# - Replace 'dns.adguardhome.example' with your target domain.
# - Replace 'dns_adguardhome_example' with your target domain where dots are replaced with underscores (certificate directory name).
# - STRONGLY RECOMMENDED: Replace '/agh/' with a site-specific unpredictable secret subpath for defense-in-depth.
# - Replace 'adguardhome_backend' and 'adguardhome_doh_backend' with unique upstream pool names.
# - Add Angie static IP 172.20.0.254 to 'trusted_proxies' in AdGuardHome.yaml so real client IPs are logged.
# - Add authorized client IPs to '$adguardhome_admin_allowed' for WebUI / API access.

upstream adguardhome_backend {
    zone adguardhome_backend 64k;
    server adguardhome:80 resolve;
    keepalive 32;
}

upstream adguardhome_doh_backend {
    zone adguardhome_doh_backend 64k;
    server adguardhome:443 resolve;
    keepalive 32;
}

limit_req_zone $binary_remote_addr zone=adguardhome_login_limit:10m rate=10r/s;

map $http_upgrade $adguardhome_connection_upgrade {
    default upgrade;
    ''      "";
}

# 1 = allow, 0 = 404
geo $remote_addr $adguardhome_admin_allowed {
    default                 0;
    # 127.0.0.1               1;
    # ::1                     1;
    # 192.168.1.0/24          1;
    # 10.0.0.0/8              1;
    # 2001:db8::/64           1;
}

# 1 = log, 0 = silence
geo $remote_addr $adguardhome_log_ip {
    default                 1;
    # 127.0.0.1               0;
    # ::1                     0;
}

map $http_user_agent $adguardhome_log_ua {
    default                 1;
    # ~*Gatus/                0;
    # ~*Uptime-Kuma           0;
}

map $request_uri $adguardhome_log_uri {
    default                 1;
    # ~*^/dns-query           0;
}

map "$adguardhome_log_ip:$adguardhome_log_ua:$adguardhome_log_uri" $adguardhome_need_log {
    default                 1;
    ~0                      0;
}

server {
    listen 80;
    server_name dns.adguardhome.example;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen 443 quic;
    server_name dns.adguardhome.example;

    ssl_certificate /var/lib/angie/acme/dns_adguardhome_example/dns.adguardhome.example.crt;
    ssl_certificate_key /var/lib/angie/acme/dns_adguardhome_example/dns.adguardhome.example.key;

    add_header Alt-Svc 'h3=":443"; ma=86400';

    access_log /var/log/angie/domains/dns.adguardhome.example.log extended if=$adguardhome_need_log;
    error_log /var/log/angie/domains/dns.adguardhome.example.error.log error;

    if ($anti_replay = 307) { return 307 https://$host$request_uri; }
    if ($anti_replay = 425) { return 425; }

    include /etc/angie/conf.d/security-headers.inc;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    include /etc/angie/conf.d/error-pages.inc;

    # include /etc/angie/conf.d/authelia-internal-verify.inc;
    # include /etc/angie/conf.d/authelia-public-ui.inc;

    location ~ /\.(?!well-known\/) {
        return 404;
    }

    location ^~ /dns-query {
        limit_except GET POST {
            deny all;
        }

        client_max_body_size 64k;
        proxy_buffering off;
        proxy_request_buffering off;

        proxy_connect_timeout 5s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Early-Data $rfc_early_data;

        proxy_ssl_server_name on;
        proxy_ssl_name $host;

        proxy_pass https://adguardhome_doh_backend;
    }

    location ^~ /agh/ {
        if ($adguardhome_admin_allowed = 0) {
            return 404;
        }

        # include /etc/angie/conf.d/authelia-protect.inc;

        limit_req zone=adguardhome_login_limit burst=30 delay=25;

        proxy_cookie_path / /agh/;
        proxy_redirect / /agh/;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $adguardhome_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Early-Data $rfc_early_data;

        client_max_body_size 32M;

        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        proxy_pass http://adguardhome_backend/;
    }

    location / {
        return 404;
    }
}
